# Gradle 설정. 기준: .claude/docs/gradle.md
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
# Android Studio · IDE의 Gradle 동기화를 병렬로 한다(Gradle 9.4+).
org.gradle.tooling.parallel=true
# 큰 의존성(robolectric nativeruntime 등) 다운로드가 CI에서 끊기면 재시도한다.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
