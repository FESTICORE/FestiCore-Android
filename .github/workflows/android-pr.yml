name: Android PR

# verify의 format-kotlin · android 단계와 같은 명령을 PR에서 돌린다. 규칙: .claude/docs/harness.md
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: 포맷 · 단위 테스트 · stage 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: java ktlint

      - uses: gradle/actions/setup-gradle@v4

      - name: 모듈 경계 (check-boundaries)
        run: .claude/scripts/check-boundaries

      - name: Kotlin (ktlint)
        run: gradle/format --check

      - name: 단위 테스트 · stage 빌드
        run: mise exec -- ./gradlew --console=plain testDebugUnitTest testStageDebugUnitTest :app:assembleStageDebug
